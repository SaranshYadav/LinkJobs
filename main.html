<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 220px;
    }
    .input-group {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .input-field {
      display: flex;
      flex-direction: column;
      width: 30%;
    }
    label {
      font-size: 11px;
      margin-bottom: 4px;
    }
    input {
      padding: 5px;
      font-size: 14px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #45a049;
    }
    #result {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h3>LinkJobs</h3>
  
  <div class="input-group">
    <div class="input-field">
      <label for="hours">Hrs</label>
      <input type="number" id="hours" min="0" value="0">
    </div>
    <div class="input-field">
      <label for="minutes">Min</label>
      <input type="number" id="minutes" min="0" value="0">
    </div>
    <div class="input-field">
      <label for="seconds">Sec</label>
      <input type="number" id="seconds" min="0" value="0">
    </div>
  </div>

  <button id="captureBtn">Capture</button>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
